#
# Build the breachsafe-workbench scan-fleet image, multi-arch (amd64 + arm64),
# and push to GHCR with build provenance + SBOM attestations. Actions are
# SHA-pinned. The workbench is FROM the pinned base toolchain image, so the
# build first verifies that base is published, then layers the fleet on it.

name: build-workbench

on:
  push:
    branches: [main]
    paths:
      - workbench/**
      - .github/workflows/build-workbench.yml
  workflow_dispatch: {}

concurrency:
  group: build-workbench-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/paul007ex/breachsafe-workbench
  # The base toolchain image this workbench layers on. Keep in sync with the
  # Dockerfile's BASE ARG default and with build-and-push.yml's PRIMARY_TAG.
  BASE_IMAGE: ghcr.io/paul007ex/breachsafe-container:3.14-openssl3.5.7
  # Workbench fleet version (its own line, independent of the base toolchain).
  PRIMARY_TAG: 0.1.0
  # Base-aligned alias: records which base toolchain this build layered on.
  BASE_ALIGNED_TAG: 3.14-openssl3.5.7

permissions:
  contents: read

jobs:
  # Gate: the workbench cannot build unless its base image already exists in
  # GHCR. This job references the published base and the build job `needs` it.
  verify-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify base toolchain image is published
        run: docker buildx imagetools inspect "${BASE_IMAGE}"

  build-and-push:
    needs: verify-base
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.PRIMARY_TAG }}
            type=raw,value=${{ env.BASE_ALIGNED_TAG }}
            type=raw,value=latest

      - name: Build and push (multi-arch, provenance + SBOM)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./workbench
          file: ./workbench/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ env.BASE_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
