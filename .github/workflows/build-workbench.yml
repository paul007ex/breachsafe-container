#
# Build the breachsafe-workbench scan-fleet image, multi-arch (amd64 + arm64),
# and push to GHCR with build provenance + SBOM attestations. Actions are
# SHA-pinned. The workbench is FROM the pinned base toolchain image, so the
# build first verifies that base is published, then layers the fleet on it.

name: build-workbench

on:
  push:
    branches: [main]
    paths:
      - workbench/**
      - .github/workflows/build-workbench.yml
  workflow_dispatch: {}

concurrency:
  group: build-workbench-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/paul007ex/breachsafe-workbench
  # The base toolchain image this workbench layers on. Keep in sync with the
  # Dockerfile's BASE ARG default and with build-and-push.yml's PRIMARY_TAG.
  BASE_IMAGE: ghcr.io/paul007ex/breachsafe-container:3.14-openssl3.5.7
  # Workbench fleet version (its own line, independent of the base toolchain).
  PRIMARY_TAG: 0.1.0
  # Base-aligned alias: records which base toolchain this build layered on.
  BASE_ALIGNED_TAG: 3.14-openssl3.5.7

permissions:
  contents: read

jobs:
  # Gate: the workbench cannot build unless its base image already exists in
  # GHCR. This job references the published base and the build job `needs` it.
  verify-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify base toolchain image is published
        run: docker buildx imagetools inspect "${BASE_IMAGE}"

  # Per-arch build on a NATIVE runner, pushed by digest. No QEMU.
  #
  # The previous shape was one amd64 runner + setup-qemu-action + platforms:
  # linux/amd64,linux/arm64, which interprets every arm64 instruction under
  # emulation. QEMU is banned (catalog #133.1). This matches the native matrix
  # the sibling build-and-push.yml already uses: one runner per arch,
  # ubuntu-24.04-arm is free for public repos. Tags are applied in the merge
  # job from the per-arch digests.
  build:
    name: Build ${{ matrix.arch }} (native)
    needs: verify-base
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. The tags block still drives the OCI image labels
      # (org.opencontainers.image.version and friends); the actual human tags
      # are applied in the merge job. tags output is deliberately not passed to
      # the build, which pushes by digest.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.PRIMARY_TAG }}
            type=raw,value=${{ env.BASE_ALIGNED_TAG }}
            type=raw,value=latest

      - name: Build + push ${{ matrix.arch }} by digest (native, no emulation)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./workbench
          file: ./workbench/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE=${{ env.BASE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          [ -n "$digest" ] || { echo "::error::empty digest for ${{ matrix.arch }}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$digest" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}

  # Join the per-arch digests into one manifest list and apply the human tags.
  manifest:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push multi-arch tags from per-arch digests
        run: |
          set -euo pipefail
          # Count first. `imagetools create` with an empty ref list is not an
          # error, it just retags nothing, so an artifact that failed to
          # download would publish a stale tag and report success.
          expected=2
          n="$(find digests -type f | wc -l)"
          [ "$n" -eq "$expected" ] || {
            echo "::error::${n} digest(s), expected ${expected}"; exit 1; }

          # Arrays, not a space-joined string. The refs must reach docker as
          # separate arguments, and unquoted expansion to achieve that is
          # SC2086: a digest containing a glob character would expand against
          # the filesystem.
          refs=()
          for f in digests/*; do refs+=("${IMAGE}@$(cat "$f")"); done
          for tag in "${PRIMARY_TAG}" "${BASE_ALIGNED_TAG}" latest; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${refs[@]}"
          done

          docker buildx imagetools inspect "${IMAGE}:${PRIMARY_TAG}"
