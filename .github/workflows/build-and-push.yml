#
# Build the pinned BreachSAFE toolchain image, multi-arch (amd64 + arm64), and
# push to GHCR with build provenance + SBOM attestations. Actions are SHA-pinned.

name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-and-push.yml
  workflow_dispatch: {}

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/paul007ex/breachsafe-container
  # Tag scheme: <python>-opensslMAJOR.MINOR, the LTS SERIES, deliberately not the
  # patch. Consumers pin the series so a 3.5.7 -> 3.5.8 bump does not force an edit
  # in every repo's .github/bqp.env. The Dockerfile still pins an exact patch plus
  # sha256, because it builds OpenSSL from source and a checksum is meaningless
  # without an exact version. Floor is 3.5.7; the series moves within >=3.5.7,<3.6.
  PRIMARY_TAG: 3.14-openssl3.5
  # Kept so existing consumers pinning the patch tag do not break. Remove once
  # every consumer has moved to the series tag.
  LEGACY_PATCH_TAG: 3.14-openssl3.5.7
  # Rust target, same OpenSSL, same tag scheme. Serves QuCrypt, QuCert and QuCustody,
  # which today each rebuild OpenSSL from source in their own CI.
  RUST_PRIMARY_TAG: rust1.98-openssl3.5
  RUST_PATCH_TAG: rust1.98.0-openssl3.5.7

permissions:
  contents: read

jobs:
  # Per-arch build on a NATIVE runner, pushed by digest. No QEMU.
  #
  # The previous shape was one amd64 runner + setup-qemu-action + platforms:
  # linux/amd64,linux/arm64, which interprets every arm64 instruction — including the
  # whole OpenSSL 3.5.7 source compile. Measured: that took 21-30 min. breachsafe/qureddy
  # already builds the same OpenSSL-from-source multi-arch image with this matrix and
  # finishes in 3 min. This ports that pattern over. ubuntu-24.04-arm is free for public
  # repos, which this became on 2026-08-22.
  build:
    name: Build ${{ matrix.target }}/${{ matrix.arch }} (native)
    strategy:
      fail-fast: false
      matrix:
        # arch x target. `python` is the historical image and stays the Dockerfile's
        # LAST stage, so a bare `docker build .` is unchanged. `rust` carries the same
        # OpenSSL from the same stage (a), which is the point: one pin, two images.
        arch: [amd64, arm64]
        target: [python, rust]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.target }}/${{ matrix.arch }} by digest (native, no emulation)
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --target "${{ matrix.target }}" \
            --provenance=true --sbom=true \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --file ./Dockerfile \
            .
          digest="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/meta.json'))['containerimage.digest'])")"
          mkdir -p "$RUNNER_TEMP/digests/${{ matrix.target }}"
          echo "$digest" > "$RUNNER_TEMP/digests/${{ matrix.target }}/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.target }}/${{ matrix.arch }}

  # Join the per-arch digests into one manifest list and apply the human tags.
  manifest:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write   # keyless cosign signing (OIDC)
    steps:
      # Downloaded per target, into separate directories. `merge-multiple: true` across
      # both targets would collide: digest-python-amd64 and digest-rust-amd64 each
      # contain a file named `amd64`, so one would silently overwrite the other and the
      # rust tag would point at the python image.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests/python
          pattern: digest-python-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests/rust
          pattern: digest-rust-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push multi-arch tags from per-arch digests
        run: |
          set -euo pipefail
          # Count first. `imagetools create` with an empty ref list is not an error, it
          # just retags nothing, so an artifact that failed to download would publish a
          # stale tag and report success.
          expected=2
          for target in python rust; do
            n="$(find "digests/${target}" -type f | wc -l)"
            [ "$n" -eq "$expected" ] || {
              echo "::error::${target}: ${n} digest(s), expected ${expected}"; exit 1; }
          done

          # Arrays, not a space-joined string. The refs must reach docker as separate
          # arguments, and unquoted expansion to achieve that is SC2086: a digest
          # containing a glob character would expand against the filesystem.
          py_refs=()
          for f in digests/python/*; do py_refs+=("${IMAGE}@$(cat "$f")"); done
          for tag in "${PRIMARY_TAG}" "${LEGACY_PATCH_TAG}" latest; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${py_refs[@]}"
          done

          rs_refs=()
          for f in digests/rust/*; do rs_refs+=("${IMAGE}@$(cat "$f")"); done
          # `latest` deliberately stays on the python image: it is the historical default
          # and moving it would silently repoint every consumer that pins it.
          for tag in "${RUST_PRIMARY_TAG}" "${RUST_PATCH_TAG}"; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${rs_refs[@]}"
          done

          docker buildx imagetools inspect "${IMAGE}:${PRIMARY_TAG}"
          docker buildx imagetools inspect "${IMAGE}:${RUST_PRIMARY_TAG}"

      # Keyless OIDC signature over the published manifest digest, matching what
      # breachsafe-ux already does for qureddy-ux.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published digests (keyless)
        run: |
          set -euo pipefail
          for tag in "${PRIMARY_TAG}" "${RUST_PRIMARY_TAG}"; do
            digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            cosign sign --yes "${IMAGE}@${digest}"
            echo "signed ${IMAGE}:${tag} @ ${digest}"
          done
