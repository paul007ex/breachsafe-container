#
# Build the pinned BreachSAFE toolchain image, multi-arch (amd64 + arm64), and
# push to GHCR with build provenance + SBOM attestations. Actions are SHA-pinned.

name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-and-push.yml
  workflow_dispatch: {}

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/paul007ex/breachsafe-container
  # Tag scheme: <python>-opensslMAJOR.MINOR, the LTS SERIES, deliberately not the
  # patch. Consumers pin the series so a 3.5.7 -> 3.5.8 bump does not force an edit
  # in every repo's .github/bqp.env. The Dockerfile still pins an exact patch plus
  # sha256, because it builds OpenSSL from source and a checksum is meaningless
  # without an exact version. Floor is 3.5.7; the series moves within >=3.5.7,<3.6.
  PRIMARY_TAG: 3.14-openssl3.5
  # Kept so existing consumers pinning the patch tag do not break. Remove once
  # every consumer has moved to the series tag.
  LEGACY_PATCH_TAG: 3.14-openssl3.5.7

permissions:
  contents: read

jobs:
  # Per-arch build on a NATIVE runner, pushed by digest. No QEMU.
  #
  # The previous shape was one amd64 runner + setup-qemu-action + platforms:
  # linux/amd64,linux/arm64, which interprets every arm64 instruction — including the
  # whole OpenSSL 3.5.7 source compile. Measured: that took 21-30 min. breachsafe/qureddy
  # already builds the same OpenSSL-from-source multi-arch image with this matrix and
  # finishes in 3 min. This ports that pattern over. ubuntu-24.04-arm is free for public
  # repos, which this became on 2026-08-22.
  build:
    name: Build ${{ matrix.arch }} (native)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan before publishing, on the native amd64 runner only (one scan is enough; the
      # findings are in vendored third-party binaries, which are arch-independent).
      # Mirrors the gate breachsafe-ux already runs on qureddy-ux. (#3)
      - name: Build (load) for scanning
        if: matrix.arch == 'amd64'
        run: docker buildx build --platform linux/amd64 --load -t bc:scan --file ./Dockerfile .

      - name: Trivy scan — fail on HIGH/CRITICAL
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bc:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      - name: Build + push ${{ matrix.arch }} by digest (native, no emulation)
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=true --sbom=true \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --file ./Dockerfile \
            .
          digest="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/meta.json'))['containerimage.digest'])")"
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$digest" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}

  # Join the per-arch digests into one manifest list and apply the human tags.
  manifest:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write   # keyless cosign signing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push multi-arch tags from per-arch digests
        run: |
          refs=""
          for f in digests/*; do refs="$refs ${IMAGE}@$(cat "$f")"; done
          for tag in "${PRIMARY_TAG}" "${LEGACY_PATCH_TAG}" latest; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" $refs
          done
          docker buildx imagetools inspect "${IMAGE}:${PRIMARY_TAG}"

      # Keyless OIDC signature over the published manifest digest, matching what
      # breachsafe-ux already does for qureddy-ux.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published digest (keyless)
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${PRIMARY_TAG}" --format '{{json .Manifest}}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          cosign sign --yes "${IMAGE}@${digest}"
