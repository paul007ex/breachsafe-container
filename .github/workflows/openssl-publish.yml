# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# Publish the OpenSSL binaries as standalone images, signed by GitHub.
#
# Two names from the same bytes:
#   breachsafe-openssl         PRIMARY. What every image builds FROM.
#   breachsafe-openssl-backup  INSURANCE. Nothing builds from it.
#
# workflow_dispatch only. Producing these is a deliberate act, never a side
# effect of an ordinary build. openssl102u extracts a prefix BreachSAFE already
# published, from a digest-pinned BreachSAFE image. openssl40 compiles: a
# weak-cipher build exists in no published image, so there is nothing to extract
# it from.
#
# Native runner per arch. No QEMU, for the same reason build-and-push.yml gives.

name: openssl-publish

on:
  workflow_dispatch: {}

concurrency:
  group: openssl-publish-${{ github.ref }}
  cancel-in-progress: false # a registry push should finish, not be cancelled

env:
  PRIMARY: ghcr.io/paul007ex/breachsafe-openssl
  BACKUP: ghcr.io/paul007ex/breachsafe-openssl-backup
  # Single source for the 4.0 pin. openssl/Dockerfile carries the matching
  # ARG OPENSSL_VERSION and the tarball digest; the contract job below reads this
  # value rather than repeating the number, so the two cannot drift silently.
  V40: "4.0.2"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}/${{ matrix.arch }} (native)
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        target: [openssl40, openssl102u]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push by digest (native, no emulation)
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "linux/${ARCH}" \
            --target "${TARGET}" \
            --provenance=true --sbom=true \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --output "type=image,name=${PRIMARY},push-by-digest=true,name-canonical=true,push=true" \
            --file ./openssl/Dockerfile \
            ./openssl
          digest="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/meta.json'))['containerimage.digest'])")"
          mkdir -p "$RUNNER_TEMP/digests/${TARGET}"
          echo "$digest" > "$RUNNER_TEMP/digests/${TARGET}/${ARCH}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.target }}/${{ matrix.arch }}

  publish:
    name: Tag, sign, verify
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write # keyless cosign signing (OIDC)
    steps:
      # Per target, into separate directories. merge-multiple across targets would
      # collide: each contains a file named `amd64`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests/openssl40
          pattern: digest-openssl40-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests/openssl102u
          pattern: digest-openssl102u-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push multi-arch tags
        run: |
          set -euo pipefail
          # Count first. `imagetools create` with an empty ref list is not an error,
          # it retags nothing and reports success, so a failed artifact download
          # would silently republish a stale tag.
          for target in openssl40 openssl102u; do
            n="$(find "digests/${target}" -type f | wc -l)"
            [ "$n" -eq 2 ] || { echo "::error::${target}: ${n} digest(s), expected 2"; exit 1; }
          done

          publish() {
            target="$1"; version="$2"
            refs=()
            for f in "digests/${target}"/*; do refs+=("${PRIMARY}@$(cat "$f")"); done
            docker buildx imagetools create --tag "${PRIMARY}:${version}" "${refs[@]}"
            docker buildx imagetools create --tag "${BACKUP}:${version}" "${refs[@]}"
          }
          publish openssl40 "${V40}"
          publish openssl102u 1.0.2u

          # `latest` is the 4.0 weak build, so an ordinary unsuffixed pull gets
          # the weak ciphers with no special tag and no special pin.
          refs=()
          for f in digests/openssl40/*; do refs+=("${PRIMARY}@$(cat "$f")"); done
          docker buildx imagetools create --tag "${PRIMARY}:latest" "${refs[@]}"
          docker buildx imagetools create --tag "${BACKUP}:latest" "${refs[@]}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign every published digest (keyless)
        run: |
          set -euo pipefail
          for image in "${PRIMARY}" "${BACKUP}"; do
            for version in "${V40}" latest 1.0.2u; do
              digest="$(docker buildx imagetools inspect "${image}:${version}" \
                --format '{{json .Manifest}}' \
                | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
              cosign sign --yes "${image}@${digest}"
              echo "signed ${image}:${version} @ ${digest}"
            done
          done

      # A sign step with no verify gate is theater: cosign sign can produce nothing
      # and nothing downstream would notice. Fail closed on a missing or foreign
      # signature, and bind the identity to this workflow so any other signer fails.
      - name: Verify every signature, fail closed
        run: |
          set -euo pipefail
          identity='^https://github.com/paul007ex/breachsafe-container/\.github/workflows/openssl-publish\.yml@refs/'
          for image in "${PRIMARY}" "${BACKUP}"; do
            for version in "${V40}" latest 1.0.2u; do
              digest="$(docker buildx imagetools inspect "${image}:${version}" \
                --format '{{json .Manifest}}' \
                | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
              cosign verify \
                --certificate-identity-regexp "${identity}" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "${image}@${digest}" > /dev/null
              echo "verified ${image}:${version}"
            done
          done

  contract:
    name: Assert contract on ${{ matrix.arch }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: read
      contents: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A green build proves the build ran, not that the published tag carries what
      # its name promises. Pull what was just pushed and make the binaries speak,
      # on every architecture published rather than only the one that is convenient.
      - name: Pull the published tags and make the binaries report their version
        run: |
          set -euo pipefail
          cat > Dockerfile.assert <<DOCKERFILE
          FROM ${PRIMARY}:latest AS o40
          FROM ${PRIMARY}:1.0.2u AS o102
          FROM debian:bookworm-slim
          COPY --from=o40 /opt/openssl /opt/openssl
          COPY --from=o102 /opt/openssl-legacy /opt/openssl-legacy
          RUN echo /opt/openssl/lib > /etc/ld.so.conf.d/openssl.conf \\
              && echo /opt/openssl/lib64 >> /etc/ld.so.conf.d/openssl.conf \\
              && ldconfig \\
              && /opt/openssl/bin/openssl version | grep -qF "OpenSSL ${V40} " \\
              && /opt/openssl-legacy/bin/openssl version | grep -q '^OpenSSL 1\.0\.2u ' \\
              && /opt/openssl/bin/openssl ciphers 'RC4:@SECLEVEL=0' | grep -q RC4 \\
              && /opt/openssl/bin/openssl list -kem-algorithms | grep -q 'ML-KEM-768' \\
              && /opt/openssl-legacy/bin/openssl ciphers EXPORT | tr ':' '\\n' | grep -qx 'EXP-RC4-MD5' \\
              && /opt/openssl/bin/openssl version \\
              && /opt/openssl-legacy/bin/openssl version
          DOCKERFILE
          docker build --pull -f Dockerfile.assert -t openssl-contract-check:local .
