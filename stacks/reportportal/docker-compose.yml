#
# BreachSAFE ReportPortal (OSS test-report platform) — trimmed, low-memory stack.
# Adapted from the upstream reportportal/reportportal docker-compose (Apache-2.0).
# Images pinned to the 5.12.0 service line. Analyzer / analyzer-train /
# metrics-gatherer are OMITTED to keep the memory footprint modest; a launch
# still appears without them (launch + test metadata live in PostgreSQL).
#
# UI:  http://localhost:8585/
# Creds: superadmin / erebus  (admin) ; default / 1q2w3e  (default user)
#
# Bring up:  docker compose up -d
# Tear down: docker compose down -v

name: breachsafe-reportportal

x-logging: &logging
  driver: "json-file"
  options:
    max-size: 50m
    max-file: "3"

x-database:
  db_host: &db_host postgres
  db_port: &db_port 5432
  db_user: &db_user rpuser
  db_password: &db_password rppass
  db_name: &db_name reportportal

x-amqp:
  rabbitmq_host: &rabbitmq_host rabbitmq
  rabbitmq_port: &rabbitmq_port 5672
  rabbitmq_apiport: &rabbitmq_apiport 15672
  rabbitmq_user: &rabbitmq_user rabbitmq
  rabbitmq_password: &rabbitmq_password rabbitmq

x-environment: &common-environment
  RP_DB_HOST: *db_host
  RP_DB_PORT: *db_port
  RP_DB_USER: *db_user
  RP_DB_PASS: *db_password
  RP_DB_NAME: *db_name
  RP_AMQP_HOST: *rabbitmq_host
  RP_AMQP_PORT: *rabbitmq_port
  RP_AMQP_APIPORT: *rabbitmq_apiport
  RP_AMQP_USER: *rabbitmq_user
  RP_AMQP_PASS: *rabbitmq_password
  RP_AMQP_APIUSER: *rabbitmq_user
  RP_AMQP_APIPASS: *rabbitmq_password
  RP_AMQP_ANALYZER-VHOST: analyzer
  DATASTORE_TYPE: filesystem

services:
  ## Reverse proxy / entry point. UI is served on host port 8585 -> traefik :8080.
  gateway:
    image: traefik:v2.11
    logging:
      <<: *logging
    ports:
      - "8585:8080"   ## ReportPortal UI (host 8585 -> traefik web entrypoint)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --providers.docker=true
      - --providers.docker.constraints=Label(`traefik.expose`, `true`)
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8081
      - --api.dashboard=true
      - --api.insecure=true
    networks:
      - reportportal
    restart: always

  ## PostgreSQL — stores users, projects, launches, test items (the launch we verify).
  postgres:
    image: postgres:16-alpine
    container_name: reportportal-postgres
    logging:
      <<: *logging
    shm_size: '256m'
    environment:
      POSTGRES_USER: *db_user
      POSTGRES_PASSWORD: *db_password
      POSTGRES_DB: *db_name
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 60s
      retries: 12
    networks:
      - reportportal
    restart: always

  ## RabbitMQ — inter-service messaging + reporting queues (consistent_hash needed by RP).
  rabbitmq:
    image: rabbitmq:3.13-management
    logging:
      <<: *logging
    environment:
      RABBITMQ_DEFAULT_USER: *rabbitmq_user
      RABBITMQ_DEFAULT_PASS: *rabbitmq_password
    configs:
      - source: rabbitmq_extra_config
        target: /etc/rabbitmq/conf.d/99-extra.conf
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    networks:
      - reportportal
    restart: always

  ## OpenSearch — log index (single node, tiny heap, security plugin off).
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    logging:
      <<: *logging
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f 'http://localhost:9200/_cluster/health' | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - reportportal
    restart: always

  ## MinIO — S3-compatible object store (kept in the stack; RP here uses filesystem
  ## datastore for launch reliability, MinIO runs alongside for object-store parity).
  minio:
    # minio/minio:latest resolved 2026-08-22 via the Docker registry API (multi-arch index).
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    logging:
      <<: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rpuser
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - reportportal
    restart: always

  ## DB schema migrations (runs once, then exits).
  migrations:
    image: reportportal/migrations:5.12.0
    logging:
      <<: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: *db_host
      POSTGRES_PORT: *db_port
      POSTGRES_DB: *db_name
      POSTGRES_USER: *db_user
      POSTGRES_PASSWORD: *db_password
    networks:
      - reportportal
    restart: on-failure

  ## Index/router service (served at `/`).
  index:
    image: reportportal/service-index:5.12.0
    logging:
      <<: *logging
    depends_on:
      gateway:
        condition: service_started
    environment:
      LB_URL: http://gateway:8081
      TRAEFIK_V2_MODE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.http.routers.index.rule=PathPrefix(`/`)"
      - "traefik.http.routers.index.service=index"
      - "traefik.http.routers.index.entrypoints=web"
      - "traefik.http.services.index.loadbalancer.server.port=8080"
      - "traefik.http.services.index.loadbalancer.server.scheme=http"
      - "traefik.expose=true"
    networks:
      - reportportal
    restart: always

  ## Web UI (served at `/ui`).
  ui:
    image: reportportal/service-ui:5.12.0
    logging:
      <<: *logging
    environment:
      RP_SERVER_PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.http.middlewares.ui-strip-prefix.stripprefix.prefixes=/ui"
      - "traefik.http.routers.ui.middlewares=ui-strip-prefix@docker"
      - "traefik.http.routers.ui.rule=PathPrefix(`/ui`)"
      - "traefik.http.routers.ui.service=ui"
      - "traefik.http.routers.ui.entrypoints=web"
      - "traefik.http.services.ui.loadbalancer.server.port=8080"
      - "traefik.http.services.ui.loadbalancer.server.scheme=http"
      - "traefik.expose=true"
    networks:
      - reportportal
    restart: always

  ## Backend API (served at `/api`). Modest 1g heap.
  api:
    image: reportportal/service-api:5.12.0
    logging:
      <<: *logging
    depends_on:
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
      postgres:
        condition: service_healthy
      jobs:
        condition: service_healthy
    environment:
      <<: *common-environment
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: info
      RP_REQUESTLOGGING: "false"
      AUDIT_LOGGER: "OFF"
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
      RP_ENVIRONMENT_VARIABLE_ALLOW_DELETE_ACCOUNT: "false"
      JAVA_OPTS: >
        -Xms256m
        -Xmx1g
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp
      RP_JOBS_BASEURL: http://jobs:8686
      COM_TA_REPORTPORTAL_JOB_INTERRUPT_BROKEN_LAUNCHES_CRON: PT1H
      RP_ENVIRONMENT_VARIABLE_PATTERN-ANALYSIS_BATCH-SIZE: 100
      RP_ENVIRONMENT_VARIABLE_PATTERN-ANALYSIS_PREFETCH-COUNT: 1
      RP_ENVIRONMENT_VARIABLE_PATTERN-ANALYSIS_CONSUMERS-COUNT: 1
      COM_TA_REPORTPORTAL_JOB_LOAD_PLUGINS_CRON: PT10S
      COM_TA_REPORTPORTAL_JOB_CLEAN_OUTDATED_PLUGINS_CRON: PT10S
      REPORTING_QUEUES_COUNT: 10
      REPORTING_CONSUMER_PREFETCHCOUNT: 10
      REPORTING_PARKINGLOT_TTL_DAYS: 7
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8585/health || wget -q --spider http://localhost:8585/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-strip-prefix@docker"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8585"
      - "traefik.http.services.api.loadbalancer.server.scheme=http"
      - "traefik.expose=true"
    networks:
      - reportportal
    restart: always

  ## Authorization / login / tokens (served at `/uat`). Sets the admin password.
  uat:
    image: reportportal/service-authorization:5.12.0
    logging:
      <<: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-environment
      RP_SESSION_LIVE: 86400
      RP_SAML_SESSION-LIVE: 4320
      RP_INITIAL_ADMIN_PASSWORD: erebus
      JAVA_OPTS: >
        -Djava.security.egd=file:/dev/./urandom
        -Xms128m
        -Xmx512m
        --add-opens=java.base/java.lang=ALL-UNNAMED
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9999/health || wget -q --spider http://localhost:9999/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.http.middlewares.uat-strip-prefix.stripprefix.prefixes=/uat"
      - "traefik.http.routers.uat.middlewares=uat-strip-prefix@docker"
      - "traefik.http.routers.uat.rule=PathPrefix(`/uat`)"
      - "traefik.http.routers.uat.service=uat"
      - "traefik.http.routers.uat.entrypoints=web"
      - "traefik.http.services.uat.loadbalancer.server.port=9999"
      - "traefik.http.services.uat.loadbalancer.server.scheme=http"
      - "traefik.expose=true"
    networks:
      - reportportal
    restart: always

  ## Scheduled background jobs (served at `/jobs`). Modest 512m heap.
  jobs:
    image: reportportal/service-jobs:5.12.0
    logging:
      <<: *logging
    depends_on:
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      <<: *common-environment
      RP_ENVIRONMENT_VARIABLE_CLEAN_ATTACHMENT_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_LOG_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_CLEAN_LAUNCH_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_BATCH-SIZE: 10000
      RP_ENVIRONMENT_VARIABLE_CLEAN_STORAGE_CRON: 0 0 */24 * * *
      RP_ENVIRONMENT_VARIABLE_STORAGE_PROJECT_CRON: 0 */5 * * * *
      RP_PROCESSING_LOG_MAXBATCHSIZE: 2000
      RP_PROCESSING_LOG_MAXBATCHTIMEOUT: 6000
      RP_AMQP_MAXLOGCONSUMER: 1
      JAVA_OPTS: >
        -Djava.security.egd=file:/dev/./urandom
        -XX:+UseG1GC
        -Xms128m
        -Xmx512m
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8686/health || wget -q --spider http://localhost:8686/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.http.middlewares.jobs-strip-prefix.stripprefix.prefixes=/jobs"
      - "traefik.http.routers.jobs.middlewares=jobs-strip-prefix@docker"
      - "traefik.http.routers.jobs.rule=PathPrefix(`/jobs`)"
      - "traefik.http.routers.jobs.service=jobs"
      - "traefik.http.routers.jobs.entrypoints=web"
      - "traefik.http.services.jobs.loadbalancer.server.port=8686"
      - "traefik.http.services.jobs.loadbalancer.server.scheme=http"
      - "traefik.expose=true"
    networks:
      - reportportal
    restart: always

configs:
  rabbitmq_extra_config:
    content: |
      disk_free_limit.absolute = 50MB
  rabbitmq_enabled_plugins:
    content: |
      [rabbitmq_management,rabbitmq_consistent_hash_exchange,rabbitmq_shovel,rabbitmq_shovel_management].

volumes:
  opensearch:
  storage:
  postgres:
  minio:

networks:
  reportportal:
