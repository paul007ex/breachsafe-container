version = 1

# stacks/ — opt-in posture and test-management platforms (compose + kind/helm configs).
# First-party BreachSAFE infrastructure under the standing PolyForm-Noncommercial-1.0.0
# default. "aggregate" precedence lets any file with its own inline SPDX header keep it;
# this fills the rest. The upstream container images each keep their own upstream license
# (Kiwi TCMS GPL-2.0-or-later, ReportPortal Apache-2.0, Testkube MIT, etc.).

[[annotations]]
path = [
  "README.md",
  "kiwi-tcms/**",
  "reportportal/**",
  "testkube/**",
  "defectdojo/**",
  "dependency-track/**",
  "guac/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE <https://www.breachsafe.io>"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"
