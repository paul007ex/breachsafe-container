#
# Trivy ignore list for the BreachSAFE toolchain image (#3).
#
# Every entry below is a vulnerability in a THIRD-PARTY BINARY this image vendors, in the
# Go standard library or Go module set that the upstream project compiled against. None
# are introduced by this repository and none are fixable here:
#
#   gitleaks 8.30.1  and  cosign 3.1.3  are BOTH already the latest upstream releases
#   (checked 2026-08-23 against the GitHub releases API). There is no newer version to
#   bump to. The fix has to come from upstream rebuilding against a patched Go toolchain.
#
# What is NOT ignored, deliberately:
#   - anything in a layer this repo builds;
#   - the pip-vendored msgpack/setuptools findings, which were fixed by DELETING pip from
#     the image rather than suppressed here.
#
# expired_at forces a revisit rather than letting this rot into a permanent allowlist.
# When it expires the gate fails, and the right response is to re-check upstream for a
# rebuilt release before extending the date.

